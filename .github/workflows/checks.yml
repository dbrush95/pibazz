name: Shelf checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: node --check shelf/shelf.js
      - run: node tests/test_ui.cjs
      - run: bash -n install-lite.sh install.sh shelf/update.sh shelf/bazzpi-shelf
